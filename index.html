<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070d1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Heft">
<title>Heft</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="apple-touch-startup-image" href="./splash.png">
<style>
:root {
  color-scheme: dark;
  --bg: #070d1a;
  --ink: #ffffff;
  --muted: rgba(255, 255, 255, 0.62);
  --gold: #f5c400;
  --sun: #f5c400;
  --warm: #2fbf4f;
  --main: #f5c400;
  --cool: #e23d3d;
  --panel: #070d1a;
  --sheet: #000000;
  --line: rgba(255, 255, 255, 0.16);
  --soft: rgba(255, 255, 255, 0.06);
  --font: "Avenir Next", "Avenir Next Demi Bold", sans-serif;
  interpolate-size: allow-keywords;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-weight: 500;
  font-size: 17px;
  line-height: 1.4;
}

button, summary, label { -webkit-tap-highlight-color: transparent; }

.file-pick {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  border: 0;
}

.gate {
  position: relative;
  min-height: 100dvh;
}

.gate-name {
  position: absolute;
  top: calc(22px + env(safe-area-inset-top));
  left: 0;
  right: 0;
  margin: 0;
  text-align: center;
}

.orb {
  position: absolute;
  left: 50%;
  top: 50%;
  translate: -50% -50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  width: min(220px, 68vw);
  aspect-ratio: 1;
  margin: 0;
  border-radius: 50%;
  background: var(--sun);
  color: #1c1408;
  box-shadow: 0 0 48px rgba(255, 225, 74, 0.38);
  font-family: var(--font);
  font-size: clamp(22px, 6vw, 28px);
  font-weight: 600;
  line-height: 1.12;
  text-align: center;
  cursor: pointer;
}

.gate-stack {
  position: absolute;
  left: 50%;
  top: calc(50% + 128px);
  translate: -50% 0;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 16px;
  width: min(300px, calc(100% - 48px));
}

.gate-copy {
  margin: 0;
  color: var(--ink);
  font-size: 17px;
  line-height: 1.35;
  text-align: center;
}

.gate-manual {
  display: block;
  width: 100%;
  margin: 0;
  padding: 14px 12px;
  border: 1.5px solid #fff;
  border-radius: 12px;
  background: transparent;
  color: #fff;
  font: 600 16px/1.25 var(--font);
  text-align: center;
}

.gate .status {
  margin: 0;
  text-align: center;
}

.book { display: none; }

body.has-program .gate,
body.is-editing .gate { display: none; }

body.has-program .book { display: block; }

.editor { display: none; }

body.is-editing .book { display: none; }

body.is-editing .editor { display: block; }

.editor {
  width: min(480px, 100%);
  margin: 0 auto;
  padding:
    calc(28px + env(safe-area-inset-top))
    22px
    calc(32px + env(safe-area-inset-bottom));
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 0 0 22px;
}

.brand {
  margin: 0;
}

.brand-mark {
  display: block;
  height: 40px;
  width: auto;
}

.gate-name .brand-mark {
  display: inline-block;
  height: 51px;
}

.days-wrap { margin: -6px 0 18px; }

.days {
  display: flex;
  gap: 8px;
  margin: 0;
  overflow-x: auto;
  scrollbar-width: none;
}

.days::-webkit-scrollbar { display: none; }

.days-scroll {
  position: relative;
  height: 3px;
  margin-top: 8px;
  border-radius: 99px;
  background: rgba(255, 255, 255, 0.18);
}

.days-scroll[hidden] { display: none; }

.days-scroll span {
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  border-radius: 99px;
  background: #fff;
}

.day {
  flex: 0 0 auto;
  margin: 0;
  padding: 8px 14px;
  border: 1.5px solid var(--ink);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font: 600 15px var(--font);
}

.day.on {
  background: #fff;
  color: var(--bg);
}

.day-title {
  margin: 0 0 12px;
  font-size: 28px;
  font-weight: 600;
  line-height: 1.1;
}

.add-day {
  display: block;
  width: 100%;
  margin: 8px 0 0;
  padding: 14px;
  border: 1.5px dashed var(--ink);
  border-radius: 14px;
  background: transparent;
  color: var(--ink);
  font: 600 17px var(--font);
}

.edit-adds {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 4px 0 0;
}

.edit-add {
  flex: 1 1 calc(50% - 8px);
  margin: 0;
  padding: 10px 8px;
  border: 1px solid rgba(255, 255, 255, 0.35);
  border-radius: 12px;
  background: transparent;
  color: #fff;
  font: 600 14px/1.2 var(--font);
}

.edit-add[data-part="warm"] { border-color: var(--warm); color: var(--warm); }
.edit-add[data-part="main"] { border-color: var(--main); color: var(--main); }
.edit-add[data-part="cool"],
.edit-add[data-part="cardio"] { border-color: var(--cool); color: var(--cool); }

.corner {
  margin: 0;
  padding: 8px 0 8px 12px;
  border: 0;
  background: none;
  color: var(--ink);
  font: 600 17px var(--font);
}

.edit-group {
  margin: 0 0 28px;
}

.edit-block {
  margin: 0 0 18px;
  padding-bottom: 6px;
}

.edit-field {
  display: block;
  margin: 0 0 12px;
}

.edit-label {
  display: block;
  margin: 0 0 6px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.edit-hint {
  display: block;
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0;
  line-height: 1.35;
  text-transform: none;
}

.edit-box {
  display: block;
  width: 100%;
  margin: 0;
  padding: 12px 14px;
  border: 1.5px dashed var(--ink);
  border-radius: 14px;
  background: transparent;
  color: var(--ink);
  font: 500 17px var(--font);
  line-height: 1.35;
  resize: vertical;
}

.book {
  position: relative;
  width: min(480px, 100%);
  margin: 0 auto;
  padding:
    calc(28px + env(safe-area-inset-top))
    22px
    calc(32px + env(safe-area-inset-bottom));
}

.kicker {
  margin: 0 0 10px;
  font-family: var(--font);
  font-size: 22px;
  font-weight: 600;
  letter-spacing: 0;
  color: var(--ink);
}

@property --rule {
  syntax: "<color>";
  inherits: true;
  initial-value: #f5c400;
}

@property --rule-b {
  syntax: "<color>";
  inherits: true;
  initial-value: #f5c400;
}

h1 {
  margin: 0;
  font-weight: 600;
  font-size: 26px;
  line-height: 1.05;
  letter-spacing: -0.03em;
}

.subtitle {
  margin: 10px 0 0;
  color: var(--muted);
  font-style: normal;
  font-size: 18px;
}

.subtitle:empty { display: none; }

.cover {
  --rule: #f5c400;
  --rule-b: #f5c400;
  --mix: 0%;
}

.cover::after {
  content: "";
  display: block;
  height: 1px;
  margin-top: 20px;
  margin-bottom: 16px;
  background: linear-gradient(90deg, transparent, var(--rule), transparent);
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--rule-b) var(--mix), var(--rule)), transparent);
  opacity: 0.75;
  transition: --rule 0.45s ease, --rule-b 0.45s ease;
}

.chapter { border-top: 1px solid var(--line); }
.chapter:first-child { border-top: 0; }

summary {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 64px;
  padding: 14px 0;
  list-style: none;
  cursor: pointer;
}

summary::-webkit-details-marker { display: none; }

summary:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
}

summary:active { background: var(--soft); }

.num {
  flex: none;
  width: 2.1em;
  font-size: 18px;
  color: var(--gold);
}

.titles {
  display: flex;
  flex-direction: column;
  gap: 3px;
  flex: 1;
  min-width: 0;
}

.name,
.ex-copy h2,
.info,
.fine,
.cues li {
  overflow-wrap: break-word;
}

.name {
  font-size: 21px;
  letter-spacing: -0.02em;
}

.count {
  font-family: var(--font);
  font-size: 12px;
  letter-spacing: 0.02em;
  color: var(--muted);
}

.mark {
  flex: none;
  width: 8px;
  height: 8px;
  margin-top: -4px;
  border-right: 1.5px solid currentColor;
  border-bottom: 1.5px solid currentColor;
  transform: rotate(45deg);
}

details[open] > summary .mark {
  margin-top: 4px;
  transform: rotate(225deg);
}

.page { padding: 0 0 8px; }

.info {
  margin: 0 0 18px;
  color: var(--muted);
  font-style: normal;
  font-size: 17px;
}

.exercise + .exercise {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
}

.deck-clip {
  container-type: inline-size;
  margin: 4px -22px 0;
}

.deck {
  display: flex;
  gap: 20px;
  padding: 4px 30px 8px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scroll-padding-inline: 30px;
  overscroll-behavior-x: contain;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.deck::-webkit-scrollbar { display: none; }

.deck:focus-visible { outline: none; }

.lens-card {
  --top: 188px;
  position: relative;
  flex: 0 0 calc(100cqi - 60px);
  height: min(520px, 68vh);
  min-height: 420px;
  overflow: hidden;
  scroll-snap-align: center;
  background: #000;
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: 18px;
}

.lens-card[data-part="warm"] { border-color: var(--warm); }
.lens-card[data-part="main"] { border-color: var(--main); }
.lens-card[data-part="cool"],
.lens-card[data-part="cardio"] { border-color: var(--cool); }

.lens-top {
  display: flex;
  align-items: center;
  justify-content: center;
  height: var(--top);
  padding: 8px 8px 0;
}

.lens-top .plates svg { width: 74px; }

.lens-top-plain p {
  margin: 0;
  font-size: 34px;
  line-height: 1.1;
  text-align: center;
  white-space: pre-line;
}

.lens-body {
  position: absolute;
  left: 0;
  right: 0;
  top: var(--top);
  height: 100%;
  padding: 16px 16px 28px;
  overflow: auto;
  background: #000;
  color: #fff;
  border-top: 1px solid rgba(255, 255, 255, 0.12);
  transform: translateY(calc(var(--top) * -1));
}

.lens-kicker {
  margin: 0 0 8px;
  font-family: var(--font);
  font-size: 13px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #fff;
}

.lens-kicker[data-part="warm"] { color: var(--warm); }
.lens-kicker[data-part="main"] { color: var(--main); }
.lens-kicker[data-part="cool"],
.lens-kicker[data-part="cardio"] { color: var(--cool); }

.deck-next {
  display: flex;
  justify-content: center;
  width: 100%;
  margin: 12px 0 0;
  padding: 4px 0 2px;
  border: 0;
  background: none;
  color: #fff;
}

.deck-next svg {
  width: 76px;
  height: 16px;
  overflow: visible;
}

.deck-next path {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.4;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.section-label {
  margin: 20px 0 4px;
  font-family: var(--font);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--gold);
}

.section-label:first-child { margin-top: 0; }

.note-block {
  margin: 0 0 14px;
  padding: 14px 16px 2px;
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: 18px;
}

.note-block[data-part="warm"] { border-color: var(--warm); }
.note-block[data-part="main"] { border-color: var(--main); }
.note-block[data-part="cool"],
.note-block[data-part="cardio"] { border-color: var(--cool); }

.note {
  margin: 0 0 12px;
  font-size: 16px;
  line-height: 1.45;
}

.count:empty { display: none; }

.ex-top {
  display: grid;
  grid-template-columns: 124px minmax(0, 1fr);
  gap: 12px;
  align-items: start;
}

.ex-top.plain { grid-template-columns: minmax(0, 1fr); }

.plates {
  display: flex;
  gap: 6px;
}

.plates figure { margin: 0; }

.plates figure.dim { opacity: 0.34; }

.plates svg {
  display: block;
  width: 56px;
  height: auto;
}

.plates figcaption {
  margin-top: 4px;
  text-align: center;
  font-family: var(--font);
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}

.atlas .skin { fill: #141820; }
.atlas .outline { fill: none; stroke: rgba(255, 255, 255, 0.72); stroke-width: 1.3; }
.atlas .head { fill: #141820; stroke: rgba(255, 255, 255, 0.72); stroke-width: 1.3; }
.atlas .m { fill: #2a3140; }
.atlas .m.on { fill: #fff; }
.lens-card[data-part="warm"] .atlas .m.on { fill: var(--warm); }
.lens-card[data-part="main"] .atlas .m.on { fill: var(--main); }
.lens-card[data-part="cool"] .atlas .m.on,
.lens-card[data-part="cardio"] .atlas .m.on { fill: var(--cool); }

.ex-copy { min-width: 0; padding-top: 2px; }

.ex-copy h2 {
  margin: 0;
  font-size: 22px;
  font-weight: 500;
  line-height: 1.15;
  letter-spacing: -0.02em;
}

.muscle {
  margin: 4px 0 0;
  color: var(--gold);
  font-style: normal;
  font-size: 18px;
}

.dose {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 8px 0 0;
}

.dose > .prescription,
.dose > .scheme { min-width: 0; }

.prescription {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin: 0;
}

.weight {
  display: flex;
  flex: none;
  align-items: center;
  gap: 8px;
  margin-left: auto;
  color: #fff;
}

.weight-label {
  font-size: 18px;
  color: var(--muted);
}

.weight-step {
  display: flex;
  align-items: center;
  gap: 2px;
}

.weight-arrow,
.weight-value {
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
}

.weight-arrow {
  width: 28px;
  height: 36px;
  font-size: 18px;
  line-height: 1;
}

.weight-value {
  min-width: 1.2em;
  font-size: 36px;
  font-weight: 500;
  line-height: 0.9;
}

.weight.is-empty .weight-value {
  min-width: 0;
  font-size: 18px;
  font-weight: 600;
  line-height: 1;
}

.weight-input {
  width: 4.6em;
  margin: 0;
  padding: 0 0 1px;
  border: 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.45);
  border-radius: 0;
  background: transparent;
  color: #fff;
  font: 500 36px/0.9 var(--font);
  text-align: right;
}

.weight.is-empty .weight-input {
  width: 5.4em;
  font-size: 18px;
  font-weight: 600;
  line-height: 1;
}

.prescription .n {
  font-size: 36px;
  line-height: 0.9;
  font-weight: 500;
}

.prescription .r {
  font-size: 18px;
  color: var(--muted);
}

.scheme {
  margin: 0;
  font-size: 20px;
  line-height: 1.3;
  white-space: pre-line;
}

.word {
  margin: 4px 0 0;
  font-family: var(--font);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}

.spoiler {
  margin-top: 12px;
  border-top: 1px solid var(--line);
}

.spoiler summary {
  min-height: 48px;
  color: var(--gold);
  font-family: var(--font);
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.how { padding: 0 0 14px; }

.frames {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.frames figure { margin: 0; }

.frames svg {
  display: block;
  width: 100%;
  height: auto;
  background: var(--panel);
  border: 1px solid var(--line);
}

.etch .ink {
  fill: none;
  stroke: var(--ink);
  stroke-width: 2px;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.etch .head {
  fill: var(--sheet);
  stroke: var(--ink);
  stroke-width: 2px;
  vector-effect: non-scaling-stroke;
}

.etch .gold {
  fill: none;
  stroke: var(--ink);
  stroke-width: 2px;
  stroke-linecap: round;
  vector-effect: non-scaling-stroke;
}

.etch .plate {
  fill: none;
  stroke: var(--ink);
  stroke-width: 1.6px;
  vector-effect: non-scaling-stroke;
}

.etch .prop {
  fill: none;
  stroke: #8a8078;
  stroke-width: 1.5px;
  stroke-linecap: round;
  vector-effect: non-scaling-stroke;
}

.etch .joint { fill: var(--ink); stroke: none; }

.frames figcaption {
  margin-top: 6px;
  text-align: center;
  font-family: var(--font);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}

.cues {
  margin: 12px 0 0;
  padding: 0;
  list-style: none;
}

.cues li {
  margin: 0 0 6px;
  color: var(--ink);
  font-size: 16px;
}

.cues li::before {
  content: "— ";
  color: var(--gold);
}

.shots img {
  display: block;
  width: 100%;
  height: auto;
  margin-bottom: 8px;
  border: 1px solid var(--line);
}

.colophon {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 10px;
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
}

.load {
  display: block;
  width: fit-content;
  max-width: 100%;
  padding: 12px 14px;
  border: 1px solid rgba(224, 196, 138, 0.45);
  color: var(--gold);
  font-family: var(--font);
  font-size: 13px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.load input { display: none; }

.linkish {
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  color: var(--muted);
  font-family: var(--font);
  font-style: normal;
  font-size: 16px;
}

.fine {
  margin: 0;
  color: var(--muted);
  font-style: normal;
  font-size: 15px;
}

.status {
  margin: 0;
  color: #e7b2a4;
  font-family: var(--font);
  font-size: 14px;
}

.status.ok { color: var(--sun); }

.status:empty { display: none; }

@media (max-width: 360px) {
  h1 { font-size: 22px; }
  .ex-top { grid-template-columns: 108px 1fr; }
  .plates svg { width: 48px; }
  .name, .ex-copy h2 { font-size: 19px; }
}

@media (prefers-reduced-motion: reduce) {
  .deck {
    display: block;
    overflow: visible;
    padding: 0;
    margin: 0;
  }

  .deck-clip { margin: 0; }

  .lens-card {
    width: 100%;
    height: auto;
    min-height: 0;
    margin-bottom: 14px;
  }

  .lens-top { height: auto; }

  .lens-body {
    position: relative;
    top: auto;
    height: auto;
    transform: none !important;
  }
}

</style>
</head>
<body>
<input id="file" class="file-pick" type="file">
<div class="gate" id="gate">
  <p class="gate-name"><img class="brand-mark" src="brand/heft-logo.svg" alt="Heft"></p>
  <label class="orb" for="file">
    <span>Загрузить</span>
    <span>программу</span>
  </label>
  <div class="gate-stack">

,"scheme":"3×12","rir":"3","rest":"90 сек","muscle":"back","muscleLabel":"Спина"},{"section":"Основная часть","name":"Отведение плеча с гантелями","scheme":"4×12","rir":"2","rest":"60 сек","muscle":"shoulders","muscleLabel":"Плечи"},{"section":"Основная часть","name":"Разгибание рук с гантелью из-за головы сидя","scheme":"3×15","rir":"3","rest":"60 сек","muscle":"triceps","muscleLabel":"Трицепс"},{"section":"Заминка","name":"Скручивания на коврике","scheme":"3×15","rir":"—","rest":"60 сек","muscle":"abs","muscleLabel":"Пресс"},{"section":"Заминка","name":"Растяжка передней линии, акцент на пресс (собака мордой вверх)","scheme":"","rir":"—","rest":"—","muscle":"abs","muscleLabel":"Пресс"},{"section":"Заминка","name":"Кардио, любой тренажёр, пульс до 130 уд/мин","scheme":"10 мин","rir":"—","rest":"—"}]},{"title":"Кардио","exercises":[],"text":"2 раза в неделю.\nНеделя 1: обе тренировки по 30 мин, пульс 130–135 уд/мин.\nСо 2-й недели чередуем: кардио А — 40 мин, пульс 130–135 уд/мин;  кардио Б — интервальное 30 мин: 3 мин ходьба / 3 мин лёгкий бег."},{"title":"Прогрессия","exercises":[],"text":"Неделя 1 — втягивание: RIR на 1 выше указанного в таблице, освоение техники и подбор рабочих весов.\nНедели 2–3 — работа по программе: RIR как в таблице. Если все подходы сделаны с запасом больше заданного — в следующую тренировку +1–2,5 кг.\nНеделя 4 — восстановительная: на 1 рабочий подход меньше в каждом упражнении, RIR 3–4, веса прежние. Кардио без интервалов.\nНедели 5–6 — RIR на 1 ниже указанного (но не ниже 1), рост весов продолжается.\nНедели 7–8 — по самочувствию: продолжение блока или переход на новую программу.\n\nСколько ещё повторов вы могли бы сделать с правильной техникой после последнего повтора подхода. RIR 2 = подберите вес так, чтобы после заданных повторов оставалось 2 в запасе. RIR 0 = до отказа. Осталось больше запаса — в следующем подходе добавьте вес, меньше — снизьте. Запись «4-2»: разминочный подход на RIR 4, рабочие подходы на RIR 2."}]}</script>
<script>
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[ch]));
}

const MUSCLE_LABELS = {
  chest: "Грудь",
  back: "Спина",
  shoulders: "Плечи",
  biceps: "Бицепс",
  triceps: "Трицепс",
  abs: "Пресс",
  quads: "Квадрицепс",
  hamstrings: "Бицепс бедра",
  glutes: "Ягодицы",
  calves: "Икры",
  legs: "Ноги"
};

const MUSCLE_ALIAS = {
  pecs: "chest",
  chest: "chest",
  грудь: "chest",
  back: "back",
  lats: "back",
  спина: "back",
  shoulders: "shoulders",
  delts: "shoulders",
  плечи: "shoulders",
  biceps: "biceps",
  бицепс: "biceps",
  triceps: "triceps",
  трицепс: "triceps",
  abs: "abs",
  пресс: "abs",
  quads: "quads",
  квадрицепс: "quads",
  hamstrings: "hamstrings",
  "бицепс бедра": "hamstrings",
  glutes: "glutes",
  ягодицы: "glutes",
  calves: "calves",
  икры: "calves",
  legs: "legs",
  ноги: "legs"
};

const BODY = "M32 36 C22 38 16 46 16 56 L14 90 C14 97 19 101 25 98 L27 68 L31 62 L33 98 C29 108 27 122 29 140 L27 162 C27 166 31 168 35 168 L40 136 L45 168 C49 168 53 166 53 162 L51 140 C53 122 51 108 47 98 L49 62 L53 68 L55 98 C61 101 66 97 66 90 L64 56 C64 46 58 38 48 36 C42 32 38 32 32 36 Z";

let figureUid = 0;

function normMuscle(value) {
  if (typeof value !== "string") return "";
  const key = value.trim().toLowerCase();
  return MUSCLE_ALIAS[key] || key;
}

function expandMuscles(ids) {
  const out = new Set();
  ids.forEach((id) => {
    if (id === "legs") ["quads", "hamstrings", "glutes", "calves"].forEach((part) => out.add(part));
    else if (id) out.add(id);
  });
  return out;
}

function muscleLabel(ex) {
  if (ex && typeof ex.muscleLabel === "string" && ex.muscleLabel.trim()) return ex.muscleLabel.trim();
  const id = normMuscle(ex && ex.muscle);
  return MUSCLE_LABELS[id] || (ex && typeof ex.muscle === "string" ? ex.muscle : "");
}

function atlasSvg(ids) {
  const on = expandMuscles(ids.map(normMuscle));
  const n = ++figureUid;
  const hot = (id) => (on.has(id) ? "m on" : "m");
  const frontIds = ["chest", "abs", "shoulders", "biceps", "quads", "calves"];
  const backIds = ["back", "shoulders", "triceps", "glutes", "hamstrings", "calves"];
  const frontHot = frontIds.some((id) => on.has(id));
  const backHot = backIds.some((id) => on.has(id));

  function body(side) {
    const clip = side + n;
    const muscles = side === "f"
      ? `
        <ellipse class="${hot("shoulders")}" cx="22" cy="52" rx="8" ry="7"/>
        <ellipse class="${hot("shoulders")}" cx="58" cy="52" rx="8" ry="7"/>
        <ellipse class="${hot("chest")}" cx="40" cy="62" rx="14" ry="9"/>
        <ellipse class="${hot("biceps")}" cx="20" cy="78" rx="4.5" ry="10"/>
        <ellipse class="${hot("biceps")}" cx="60" cy="78" rx="4.5" ry="10"/>
        <ellipse class="${hot("abs")}" cx="40" cy="86" rx="6" ry="12"/>
        <ellipse class="${hot("quads")}" cx="35" cy="128" rx="6" ry="16"/>
        <ellipse class="${hot("quads")}" cx="45" cy="128" rx="6" ry="16"/>
        <ellipse class="${hot("calves")}" cx="33" cy="154" rx="4" ry="8"/>
        <ellipse class="${hot("calves")}" cx="47" cy="154" rx="4" ry="8"/>`
      : `
        <ellipse class="${hot("shoulders")}" cx="22" cy="52" rx="8" ry="7"/>
        <ellipse class="${hot("shoulders")}" cx="58" cy="52" rx="8" ry="7"/>
        <ellipse class="${hot("back")}" cx="40" cy="58" rx="10" ry="6"/>
        <ellipse class="${hot("back")}" cx="40" cy="76" rx="15" ry="12"/>
        <ellipse class="${hot("triceps")}" cx="19" cy="76" rx="4.5" ry="10"/>
        <ellipse class="${hot("triceps")}" cx="61" cy="76" rx="4.5" ry="10"/>
        <ellipse class="${hot("glutes")}" cx="34" cy="108" rx="7" ry="6"/>
        <ellipse class="${hot("glutes")}" cx="46" cy="108" rx="7" ry="6"/>
        <ellipse class="${hot("hamstrings")}" cx="35" cy="130" rx="5.5" ry="14"/>
        <ellipse class="${hot("hamstrings")}" cx="45" cy="130" rx="5.5" ry="14"/>
        <ellipse class="${hot("calves")}" cx="33" cy="154" rx="4" ry="8"/>
        <ellipse class="${hot("calves")}" cx="47" cy="154" rx="4" ry="8"/>`;
    return `<svg class="atlas" viewBox="0 0 80 176" role="img">
      <defs><clipPath id="${clip}"><path d="${BODY}"/></clipPath></defs>
      <g clip-path="url(#${clip})">
        <rect class="skin" x="0" y="0" width="80" height="176"/>
        ${muscles}
      </g>
      <path class="outline" d="${BODY}"/>
      <circle class="head" cx="40" cy="20" r="12"/>
    </svg>`;
  }

  const label = ids.map((id) => MUSCLE_LABELS[normMuscle(id)] || id).filter(Boolean).join(", ");
  return `<div class="plates" aria-label="${esc(label || "мышцы")}">
    <figure class="${frontHot ? "" : "dim"}">${body("f")}<figcaption>спереди</figcaption></figure>
    <figure class="${backHot ? "" : "dim"}">${body("b")}<figcaption>сзади</figcaption></figure>
  </div>`;
}

function polar(x, y, deg, len) {
  const r = (deg * Math.PI) / 180;
  return [Math.round((x + Math.cos(r) * len) * 10) / 10, Math.round((y + Math.sin(r) * len) * 10) / 10];
}

function pose(over) {
  return Object.assign({
    shoulder: [80, 40],
    torso: 78,
    torsoLen: 50,
    thigh: 96,
    thighLen: 42,
    shin: 82,
    shinLen: 40,
    foot: 175,
    arm: 80,
    armLen: 30,
    fore: 86,
    foreLen: 28,
    face: 180,
    support: "floor",
    bar: "hands"
  }, over);
}

function barEnds(x, y) {
  return `<path class="gold" d="M${x - 16} ${y} H${x + 16} M${x - 16} ${y - 7} V${y + 7} M${x + 16} ${y - 7} V${y + 7}"/>`;
}

function poseParts(cfg) {
  const S = cfg.shoulder;
  const hip = polar(S[0], S[1], cfg.torso, cfg.torsoLen);
  const knee = polar(hip[0], hip[1], cfg.thigh, cfg.thighLen);
  const ankle = polar(knee[0], knee[1], cfg.shin, cfg.shinLen);
  const toe = polar(ankle[0], ankle[1], cfg.foot, 16);
  const heel = polar(ankle[0], ankle[1], cfg.foot + 180, 7);
  const elbow = polar(S[0], S[1], cfg.arm, cfg.armLen);
  const wrist = polar(elbow[0], elbow[1], cfg.fore, cfg.foreLen);
  const headDir = cfg.headDir == null ? cfg.torso + 180 : cfg.headDir;
  const head = polar(S[0], S[1], headDir, cfg.headDist || 16);
  const nose = polar(head[0], head[1], cfg.face, 13);
  const pts = [S, hip, knee, ankle, toe, heel, elbow, wrist, head, nose, [head[0] - 12, head[1] - 12], [head[0] + 12, head[1] + 12]];

  let prop = "";
  if (cfg.support === "bench") {
    const y = Math.max(S[1], hip[1]) + 13;
    const x1 = Math.min(head[0], S[0]) - 16;
    const x2 = Math.max(hip[0], knee[0]) + 18;
    prop = `<path class="prop" d="M${x1} ${y} H${x2} M${x1 + 14} ${y} V${y + 16} M${x2 - 14} ${y} V${y + 16}"/>`;
    pts.push([x1, y], [x2, y + 16]);
  } else if (cfg.support === "incline") {
    const x1 = head[0] - 14;
    const y1 = S[1] + 16;
    const x2 = hip[0] + 16;
    const y2 = hip[1] + 12;
    prop = `<path class="prop" d="M${x1} ${y1} L${x2} ${y2} M${x1 + 8} ${y1 + 4} l-6 16 M${x2 - 10} ${y2} l6 16"/>`;
    pts.push([x1, y1], [x2, y2 + 16]);
  } else if (cfg.support === "seat") {
    const y = hip[1] + 6;
    const xBack = Math.max(hip[0], S[0]) + 8;
    const xFront = Math.min(knee[0], hip[0]) - 6;
    prop = `<path class="prop" d="M${xFront} ${y} H${xBack} V${S[1] - 4} M${xBack - 10} ${y} V${y + 18}"/>`;
    pts.push([xFront, y + 18], [xBack, S[1] - 4]);
  } else if (cfg.support === "press") {
    const seatY = hip[1] + 8;
    const plateX = Math.min(toe[0], ankle[0]) - 10;
    const plateTop = Math.min(toe[1], ankle[1], knee[1]) - 8;
    const plateBot = Math.max(toe[1], ankle[1], knee[1]) + 10;
    prop = `<path class="prop" d="M${hip[0] - 18} ${seatY} H${hip[0] + 22} M${S[0] + 2} ${S[1] + 6} L${hip[0] + 14} ${seatY}"/>`;
    prop += `<path class="gold" d="M${plateX} ${plateTop} L${plateX + 4} ${plateBot}"/>`;
    pts.push([hip[0] - 18, seatY], [S[0], S[1]], [plateX, plateTop], [plateX, plateBot]);
  } else {
    const y = Math.max(ankle[1], toe[1], heel[1]) + 3;
    const x1 = Math.min(toe[0], heel[0], head[0], wrist[0]) - 18;
    const x2 = Math.max(toe[0], heel[0], hip[0], wrist[0]) + 18;
    prop = `<path class="prop" d="M${x1} ${y} H${x2}"/>`;
    pts.push([x1, y], [x2, y]);
  }

  let bar = "";
  if (cfg.bar === "dumbbell") {
    const a = polar(wrist[0], wrist[1], 35, 9);
    const b = polar(wrist[0], wrist[1], 215, 9);
    pts.push(a, b);
    bar = `<path class="gold" d="M${a[0]} ${a[1]} L${b[0]} ${b[1]}"/>`;
  } else if (cfg.bar === "back") {
    const x = S[0];
    const y = S[1] - 6;
    pts.push([x - 24, y - 10], [x + 24, y + 10]);
    bar = barEnds(x, y);
  } else if (cfg.bar !== "none") {
    const x = wrist[0];
    const y = wrist[1];
    pts.push([x - 24, y - 10], [x + 24, y + 10]);
    bar = barEnds(x, y);
  }

  const body = `<path class="ink" d="M${S[0]} ${S[1]} L${hip[0]} ${hip[1]} L${knee[0]} ${knee[1]} L${ankle[0]} ${ankle[1]} L${toe[0]} ${toe[1]} M${ankle[0]} ${ankle[1]} L${heel[0]} ${heel[1]}"/>
    <path class="ink" d="M${S[0]} ${S[1]} L${elbow[0]} ${elbow[1]} L${wrist[0]} ${wrist[1]}"/>
    <circle class="head" cx="${head[0]}" cy="${head[1]}" r="10"/>
    <path class="ink" d="M${head[0]} ${head[1]} L${nose[0]} ${nose[1]}"/>`;
  return { prop, body, bar, pts };
}

function viewBoxOf(pts) {
  let minX = Infinity;
  let minY = Infinity;
  let maxX = -Infinity;
  let maxY = -Infinity;
  pts.forEach((p) => {
    minX = Math.min(minX, p[0]);
    minY = Math.min(minY, p[1]);
    maxX = Math.max(maxX, p[0]);
    maxY = Math.max(maxY, p[1]);
  });
  const pad = 16;
  return `${minX - pad} ${minY - pad} ${maxX - minX + pad * 2} ${maxY - minY + pad * 2}`;
}

}

function plural(n, one, few, many) {
  const n10 = n % 10;
  const n100 = n % 100;
  if (n10 === 1 && n100 !== 11) return one;
  if (n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) return few;
  return many;
}

function roman(n) {
  const map = ["", "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII", "XIII", "XIV", "XV", "XVI", "XVII", "XVIII", "XIX", "XX"];
  return map[n] || String(n);
}

function validProgram(data) {
  return Boolean(data && Array.isArray(data.workouts) && data.workouts.length

}

function cleanMeta(value) {
  if (typeof value !== "string") return "";
  const text = value.trim();
  if (!text || text === "—") return "";

function parseScheme(scheme) {
  const raw = String(scheme || "").trim();
  if (!raw) return { kind: "empty" };
  if (raw.includes("+") || /разм/i.test(raw)) return { kind: "block", text: raw };
  const match = raw.match(/^(\d+)\s*[×xх]\s*(.+)$/);
  if (match) return { kind: "simple", n: Number(match[1]), reps: match[2].trim() };
  return { kind: "block", text: raw };
}

function workingSets(ex) {
  if (typeof ex.sets === "number" && isFinite(ex.sets)) return ex.sets;
  const scheme = String(ex.scheme || ex.sets || "");
  const plus = scheme.match(/\+\s*(\d+)\s*[×xх]/);
  if (plus) return Number(plus[1]);
  const first = scheme.match(/(\d+)\s*[×xх]/);
  return first ? Number(first[1]) : 0;
}

function setsCount(ex) {
  return workingSets(ex);
}

function safeSrc(src) {
  if (typeof src !== "string") return "";
  const value = src.trim();
  if (!value || value.length > 2000000) return "";
  if (value.startsWith("images/") || value.startsWith("./images/") || value.startsWith("/images/")) return value;
  if (value.startsWith("data:image/")) return value;
  try {
    const url = new URL(value);
    if (url.protocol === "https:" || url.protocol === "http:") return value;
  } catch (err) {
    return "";
  }
  return "";
}

function imagesBlock(ex) {
  const raw = ex.images ?? ex.image ?? [];
  const list = (Array.isArray(raw) ? raw : [raw]).map(safeSrc).filter(Boolean);
  if (!list.length) return "";
  return `<div class="shots">${list.map((src) => `<img src="${esc(src)}" alt="${esc(ex.name || "Упражнение")}">`).join("")}</div>`;
}

function spoiler(ex) {
  const shots = imagesBlock(ex);
  const diagram = shots ? "" : diagramBlock(ex.diagram);
  const cues = Array.isArray(ex.cues) ? ex.cues.filter((cue) => typeof cue === "string" && cue.trim()) : [];
  if (!shots && !diagram && !cues.length) return "";
  const cuesHtml = cues.length
    ? `<ul class="cues">${cues.map((cue) => `<li>${esc(cue)}</li>`).join("")}</ul>`
    : "";
  return `<details class="spoiler">
    <summary><span>Как выполнять</span><span class="mark" aria-hidden="true"></span></summary>
    <div class="how">${shots}${diagram}${cuesHtml}</div>
  </details>`;
}

function schemeOf(ex) {

function parseWeight(value) {
  const text = String(value ?? "").trim().replace(",", ".");
  const match = text.match(/(\d+(?:\.\d+)?)/);
  if (!match) return null;
  const n = Number(match[1]);
  if (!Number.isFinite(n) || n <= 0) return null;
  return Math.round(n * 100) / 100;
}

function formatWeight(n) {
  return String(Math.round(n * 100) / 100).replace(".", ",");
}

function weightControl(ex, source) {
  const n = parseWeight(ex.weight);
  const shown = n == null ? "Указать" : formatWeight(n);

      <button class="weight-arrow" type="button" data-weight-dec aria-label="Меньше на 0,5 кг">←</button>

      <button class="weight-arrow" type="button" data-weight-inc aria-label="Больше на 0,5 кг">→</button>
    </span>

function partOf(ex) {
  const name = String((ex && ex.name) || "").toLowerCase().replace(/ё/g, "е");
  const section = String((ex && ex.section) || "").toLowerCase().replace(/ё/g, "е");
  if (name.includes("кардио") || section.includes("кардио")) return "cardio";
  if (section.startsWith("размин")) return "warm";
  if (section.startsWith("основ")) return "main";
  if (section.startsWith("замин")) return "cool";
  return "";
}

function exerciseHtml(ex, index, total, source) {
  const ids = muscleIds(ex);
  const label = muscleLabel(ex);
  const scheme = schemeOf(ex);
  const bits = [];
  if (scheme.kind === "simple") bits.push(plural(scheme.n, "подход", "подхода", "подходов"));
  const rir = cleanMeta(ex.rir);
  const rest = cleanMeta(ex.rest);
  if (rir) bits.push("RIR " + rir);
  if (rest) bits.push("отдых " + rest);
  const prescription = scheme.kind === "simple"
    ? `<p class="prescription"><span class="n">${esc(String(scheme.n))}</span><span class="r">× ${esc(scheme.reps)}</span></p>`
    : (scheme.kind === "block" ? `<p class="scheme">${esc(scheme.text)}</p>` : "");
  const dose = `<div class="dose">${prescription}${weightControl(ex, source)}</div>`;
  const part = partOf(ex);
  const kicker = [ex.section, total ? `${index + 1} / ${total}` : ""].filter(Boolean).join(" · ");
  const plainTop = scheme.kind === "block" ? scheme.text : (scheme.kind === "simple" ? `${scheme.n} × ${scheme.reps}` : (ex.section || ""));
  const top = ids.length
    ? `<div class="lens-top">${atlasSvg(ids)}</div>`
    : `<div class="lens-top lens-top-plain"><p>${esc(plainTop)}</p></div>`;
  return `<article class="lens-card"${part ? ` data-part="${part}"` : ""}>
    ${top}
    <div class="lens-body">
      ${kicker ? `<p class="lens-kicker"${part ? ` data-part="${part}"` : ""}>${esc(kicker)}</p>` : ""}
      <h2>${esc(ex.name || "Упражнение")}</h2>
      ${label ? `<p class="muscle">${esc(label)}</p>` : ""}
      ${dose}
      ${bits.length ? `<p class="word">${esc(bits.join(" · "))}</p>` : ""}
      ${spoiler(ex)}
    </div>
  </article>`;
}

function exerciseItems(workout) {

function renderDay(workout) {
  if (!workout) return "";

  const notes = typeof workout.text === "string"
    ? workout.text.split(/\n+/).map((line) => line.trim()).filter(Boolean).map((line) => `<p class="note">${esc(line)}</p>`).join("")
    : "";
  const title = `<h2 class="day-title">${esc(workout.title || "День")}</h2>`;
  const dayPart = partOf({ name: workout.title, section: "" });
  const noteBlock = notes ? `<div class="note-block"${dayPart ? ` data-part="${dayPart}"` : ""}>${notes}</div>` : "";
  const cards = items.length ? deckHtml(items) : (notes ? "" : `<p class="info">В этом дне пока нет упражнений.</p>`);
  return title + noteBlock + cards;
}

function renderChapters(program) {
  return program.workouts.map((workout, index) => {
    const items = exerciseItems(workout);
    const exercises = items.map((item) => item.ex);
    const totalSets = exercises.reduce((sum, ex) => sum + setsCount(ex), 0);
    const bits = [`${exercises.length} ${plural(exercises.length, "упражнение", "упражнения", "упражнений")}`];
    if (totalSets) bits.push(`${totalSets} ${plural(totalSets, "подход", "подхода", "подходов")}`);
    const info = typeof workout.info === "string" && workout.info.trim()
      ? `<p class="info">${esc(workout.info.trim())}</p>`
      : "";
    const notes = typeof workout.text === "string"
      ? workout.text.split(/\n+/).map((line) => line.trim()).filter(Boolean).map((line) => `<p class="note">${esc(line)}</p>`).join("")
      : "";
    const body = exercises.length
      ? deckHtml(items)
      : (notes ? "" : `<p class="info">В этой тренировке пока нет упражнений.</p>`);
    const count = exercises.length ? bits.join(" · ") : "";
    return `<article class="chapter">
      <details>
        <summary>
          <span class="num">${roman(index + 1)}</span>
          <span class="titles">
            <span class="name">${esc(workout.title)}</span>
            <span class="count">${esc(count)}</span>
          </span>
          <span class="mark" aria-hidden="true"></span>
        </summary>
        <div class="page">${info}${notes}${body}</div>
      </details>
    </article>`;
  }).join("");
}

function xmlDecode(value) {
  return String(value || "")
    .replace(/&lt;/g, "<")
    .replace(/&gt;/g, ">")
    .replace(/&quot;/g, '"')
    .replace(/&apos;/g, "'")
    .replace(/&#(\d+);/g, (_, n) => String.fromCharCode(Number(n)))
    .replace(/&amp;/g, "&");
}

function textsIn(xml) {
  const clean = String(xml || "").replace(/<rPh\b[\s\S]*?<\/rPh>/g, "");
  const parts = [];
  const re = /<t\b[^>]*>([\s\S]*?)<\/t>/g;
  let match;
  while ((match = re.exec(clean))) parts.push(xmlDecode(match[1]));
  return parts.join("");
}

function u16(bytes, offset) {
  return bytes[offset] | (bytes[offset + 1] << 8);
}

function u32(bytes, offset) {
  return (bytes[offset] | (bytes[offset + 1] << 8) | (bytes[offset + 2] << 16) | (bytes[offset + 3] << 24)) >>> 0;
}

function findEocd(bytes) {
  const min = Math.max(0, bytes.length - 22 - 65535);
  for (let i = bytes.length - 22; i >= min; i--) {
    if (bytes[i] === 0x50 && bytes[i + 1] === 0x4b && bytes[i + 2] === 0x05 && bytes[i + 3] === 0x06) return i;
  }
  return -1;
}

async function inflateRaw(bytes) {
  if (typeof DecompressionStream !== "function") {
    throw new Error("Этот браузер не открывает Excel. Открой книгу в Safari.");
  }
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function unzip(bytes) {
  const eocd = findEocd(bytes);
  if (eocd < 0) throw new Error("Файл не похож на таблицу Excel.");
  const count = u16(bytes, eocd + 10);
  let offset = u32(bytes, eocd + 16);
  const files = new Map();
  for (let i = 0; i < count; i++) {
    if (u32(bytes, offset) !== 0x02014b50) throw new Error("Файл Excel повреждён.");
    const method = u16(bytes, offset + 10);
    const compSize = u32(bytes, offset + 20);
    const nameLen = u16(bytes, offset + 28);
    const extraLen = u16(bytes, offset + 30);
    const commentLen = u16(bytes, offset + 32);
    const localOff = u32(bytes, offset + 42);
    const name = new TextDecoder().decode(bytes.subarray(offset + 46, offset + 46 + nameLen));
    offset += 46 + nameLen + extraLen + commentLen;
    if (name.endsWith("/")) continue;
    const dataOff = localOff + 30 + u16(bytes, localOff + 26) + u16(bytes, localOff + 28);
    const comp = bytes.subarray(dataOff, dataOff + compSize);
    if (method === 0) files.set(name, comp);
    else if (method === 8) files.set(name, await inflateRaw(comp));
  }
  return files;
}

function parseSharedStrings(xml) {
  const out = [];
  const re = /<si\b[^>]*>([\s\S]*?)<\/si>/g;
  let match;
  while ((match = re.exec(xml))) out.push(textsIn(match[1]));
  return out;
}

function colIndex(ref) {
  const letters = String(ref || "").match(/[A-Z]+/);
  if (!letters) return 0;
  let n = 0;
  for (const ch of letters[0]) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n - 1;
}

function cellText(xml, shared) {
  const type = (xml.match(/\bt="([^"]+)"/) || [])[1] || "";
  if (type === "inlineStr") {
    const inline = xml.match(/<is\b[^>]*>([\s\S]*?)<\/is>/);
    return textsIn(inline ? inline[1] : "");
  }
  const value = xml.match(/<v[^>]*>([\s\S]*?)<\/v>/);
  if (!value) return "";
  const raw = xmlDecode(value[1]).trim();
  if (type === "s") return shared[Number(raw)] || "";
  return raw;
}

function parseSheet(xml, shared) {
  const rows = [];
  const rowRe = /<row\b([^>]*)>([\s\S]*?)<\/row>/g;
  let rowMatch;
  while ((rowMatch = rowRe.exec(xml))) {
    const row = [];
    const cellRe = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;
    let cellMatch;
    while ((cellMatch = cellRe.exec(rowMatch[2]))) {
      const ref = (cellMatch[1].match(/\br="([^"]+)"/) || [])[1] || "";
      const text = cellText(cellMatch[1] + ">" + (cellMatch[2] || ""), shared).replace(/\r\n/g, "\n").trim();
      const index = colIndex(ref);
      while (row.length <= index) row.push("");
      row[index] = text;
    }
    if (row.some((cell) => cell)) rows.push(row);
  }
  return rows;
}

function decodeText(bytes) {
  const utf = new TextDecoder("utf-8", { fatal: false }).decode(bytes).replace(/^\uFEFF/, "");
  const bad = (utf.match(/\uFFFD/g) || []).length;
  if (bad > 2 && typeof TextDecoder === "function") {
    try { return new TextDecoder("windows-1251").decode(bytes); } catch (err) { /* keep utf-8 */ }
  }
  return utf;
}

function parseCsv(text) {
  const lines = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
  const sample = lines.slice(0, 2000);
  const commas = (sample.match(/,/g) || []).length;
  const semis = (sample.match(/;/g) || []).length;
  const tabs = (sample.match(/\t/g) || []).length;
  const delim = tabs > commas && tabs > semis ? "\t" : (semis > commas ? ";" : ",");
  const rows = [];
  let row = [];
  let cell = "";
  let quoted = false;
  for (let i = 0; i < lines.length; i++) {
    const ch = lines[i];
    if (quoted) {
      if (ch === '"') {
        if (lines[i + 1] === '"') { cell += '"'; i++; }
        else quoted = false;
      } else cell += ch;
      continue;
    }
    if (ch === '"') quoted = true;
    else if (ch === delim) { row.push(cell.trim()); cell = ""; }
    else if (ch === "\n") { row.push(cell.trim()); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if (cell || row.length) { row.push(cell.trim()); rows.push(row); }
  return rows.filter((item) => item.some((value) => value));
}

function headerKind(text) {
  const raw = String(text || "").trim();
  if (raw.length > 40) return "";
  const s = raw.toLowerCase().replace(/ё/g, "е");
  if (!s) return "";
  if (/^(№|#|n|no|номер)$/.test(s)) return "num";
  if (/^(упражнени[ея]|exercise|название|движение)$/.test(s)) return "name";
  if (/^подх\s*[×xх]\s*повт|^повт\s*[×xх]\s*подх|^схема$/.test(s)) return "scheme";
  if (/^(подх(оды)?|подход(ы)?|sets?)$/.test(s)) return "sets";
  if (/^(повт(оры|орений)?|reps?)$/.test(s)) return "reps";
  if (/^rir$/.test(s)) return "rir";
  if (/^(отдых|rest|пауза)$/.test(s)) return "rest";
  if (/^(вес|weight|нагрузка)$/.test(s)) return "weight";
  if (/^(раздел|секция|section|блок)$/.test(s)) return "section";
  return "";
}

function sectionName(text) {
  const raw = String(text || "").trim();
  const s = raw.toLowerCase().replace(/ё/g, "е");
  if (/^разминк|^warm/.test(s)) return raw;
  if (/^основн|^main/.test(s)) return raw;
  if (/^заминка|^заминк|^cool/.test(s)) return raw;
  return "";
}

function prettyWorkoutTitle(text, index) {
  const raw = String(text || "").trim();
  const match = raw.match(/^(тренировка|workout|день|session|занятие)\s*(\d+)\b/i);
  if (match) {
    const word = match[1].toLowerCase();
    const title = word.charAt(0).toUpperCase() + word.slice(1);
    return title + " " + match[2];
  }
  return raw || ("Тренировка " + index);
}

function metaValue(rows, labelRe) {
  for (const row of rows) {
    for (let c = 0; c < row.length; c++) {
      if (!labelRe.test(String(row[c] || "").replace(/:$/, ""))) continue;
      for (let n = c + 1; n < row.length; n++) {
        const next = String(row[n] || "").trim();
        if (next) return next;
      }
    }
  }
  return "";
}

function guessMuscle(name) {
  const s = String(name || "").toLowerCase().replace(/ё/g, "е");
  const rules = [
    [/кардио|пульс/, null],
    [/задн(ей|яя) цеп/, { muscle: "hamstrings", label: "Задняя цепь" }],
    [/передн(ей|яя) цеп/, { muscles: ["chest", "quads"], label: "Грудь · квадрицепс" }],
    [/передн(ей|яя) линии|собака мордой|скручиван|dead bug|планка|пресс/, { muscle: "abs", label: "Пресс" }],
    [/присед.*грудн|грудн.*присед/, { muscles: ["quads", "back"], label: "Ноги · грудной отдел" }],
    [/грудн(ого|ой) отдел/, { muscle: "back", label: "Грудной отдел" }],
    [/сгибател(я|ей) бедра/, { muscle: "quads", label: "Сгибатели бедра" }],
    [/сгибание голени|бицепс бедра/, { muscle: "hamstrings", label: "Бицепс бедра" }],
    [/отведение бедра|ягодич|мостик/, { muscle: "glutes", label: "Ягодицы" }],
    [/разгибание голени|квадрицепс|присед|выпад/, { muscle: "quads", label: /выпад/.test(s) ? "Ноги" : "Квадрицепс" }],
    [/трицепс|разгибание рук/, { muscle: "triceps", label: "Трицепс" }],
    [/сгибание рук|\bбицепс\b/, { muscle: "biceps", label: "Бицепс" }],
    [/тяга|подтяг/, { muscle: "back", label: "Спина" }],
    [/приведение плеча|наклонн|грудь|грудн/, { muscle: "chest", label: "Грудь" }],
    [/отведение плеча|манжет|ротация плеча|плеч|дельт|вертикальный жим/, { muscle: "shoulders", label: "Плечи" }],
    [/спин|экстенз|позвоночник/, { muscle: "back", label: "Спина" }],
    [/икр/, { muscle: "calves", label: "Икры" }],
    [/ног|бедр/, { muscle: "legs", label: "Ноги" }]
  ];
  for (const [re, hit] of rules) {
    if (re.test(s)) return hit;
  }
  return null;
}

function withMuscle(ex) {
  const hit = guessMuscle(ex.name);
  if (!hit) return ex;
  if (hit.muscles) ex.muscles = hit.muscles;
  else ex.muscle = hit.muscle;
  if (hit.label) ex.muscleLabel = hit.label;
  return ex;
}

function programFromRows(rows, fileName) {
  const workouts = [];
  const usedTitleRows = new Set();
  rows.forEach((row, rowIndex) => {
    const nameCols = [];
    row.forEach((cell, index) => {
      if (headerKind(cell) === "name") nameCols.push(index);
    });
    if (!nameCols.length) return;
    nameCols.forEach((nameCol, blockIndex) => {
      const fields = { name: nameCol };
      const nextName = nameCols[blockIndex + 1] == null ? row.length : nameCols[blockIndex + 1];
      for (let c = nameCol + 1; c < nextName && c < nameCol + 8; c++) {
        const kind = headerKind(row[c]);
        if (kind && kind !== "name" && fields[kind] == null) fields[kind] = c;
      }
      if (nameCol > 0 && headerKind(row[nameCol - 1]) === "num") fields.num = nameCol - 1;
      const blockStart = fields.num == null ? nameCol : fields.num;
      let title = "";
      for (let r = rowIndex - 1; r >= 0 && r >= rowIndex - 4; r--) {
        const above = rows[r] || [];
        for (let c = blockStart; c <= nameCol; c++) {
          const text = String(above[c] || "").trim();
          if (text.length <= 40 && /^(тренировка|workout|день|session|занятие)\b/i.test(text)) {
            title = text;
            usedTitleRows.add(r);
            break;
          }
        }
        if (title) break;
      }
      const exercises = [];
      let section = "";
      for (let r = rowIndex + 1; r < rows.length; r++) {
        const line = rows[r] || [];
        if (line.some((cell) => headerKind(cell) === "name")) break;
        const atStart = String(line[blockStart] || "").trim();
        const atName = String(line[fields.name] || "").trim();
        const sectionCell = sectionName(atStart) || sectionName(atName);
        if (sectionCell && !atName) { section = sectionCell; continue; }
        if (sectionName(atName) && atName.length < 40) { section = sectionName(atName); continue; }
        if (!atName || atName.length > 140 || (atName.length > 80 && atName.includes(". "))) continue;
        const schemeCell = fields.scheme == null ? "" : String(line[fields.scheme] || "").trim();
        const setsCell = fields.sets == null ? "" : String(line[fields.sets] || "").trim();
        const repsCell = fields.reps == null ? "" : String(line[fields.reps] || "").trim();
        let scheme = schemeCell;
        if (!scheme && (setsCell || repsCell)) {
          scheme = setsCell && repsCell && !/[×xх]/.test(setsCell) ? setsCell + "×" + repsCell : (setsCell || repsCell);
        }
        const ex = { name: atName, scheme: scheme };
        if (section) ex.section = section;
        ["rir", "rest", "weight"].forEach((key) => {
          if (fields[key] == null) return;
          const value = String(line[fields[key]] || "").trim();
          if (value) ex[key] = value;
        });
        exercises.push(withMuscle(ex));
      }
      if (exercises.length) {
        workouts.push({
          title: prettyWorkoutTitle(title, workouts.length + 1),
          exercises: exercises
        });
      }
    });
  });

  const notes = [];
  rows.forEach((row, rowIndex) => {
    if (usedTitleRows.has(rowIndex)) return;
    const filled = row.map((cell) => String(cell || "").trim()).filter(Boolean);
    if (filled.length !== 1) return;
    const heading = filled[0];
    if (heading.length > 60 || headerKind(heading) || sectionName(heading)) return;
    if (/программа тренировок|^клиент$|^период$|^цель$/i.test(heading.replace(/:$/, ""))) return;
    const next = rows[rowIndex + 1] || [];
    const body = next.map((cell) => String(cell || "").trim()).filter(Boolean).join("\n");
    if (body.length < 40) return;
    notes.push({ title: heading.replace(/:$/, ""), exercises: [], text: body });
  });

  const title = metaValue(rows, /^клиент$/i) || fileTitle(fileName);
  const subtitle = metaValue(rows, /^период$/i);
  return { title: title, subtitle: subtitle, workouts: workouts.concat(notes) };
}

function fileTitle(fileName) {
  const base = String(fileName || "").replace(/\.[^.]+$/, "").replace(/[_]+/g, " ").trim();
  return base || "Тренировки";
}

function programFromLooseText(text, fileName) {
  const lines = text.split(/\n+/).map((line) => line.trim()).filter(Boolean);
  const exercises = [];
  lines.forEach((line) => {
    if (line.length > 140 || /^(упражнение|exercise|название)\b/i.test(line)) return;
    const match = line.match(/^(?:\d+[\).\]]\s*)?(.+?)(?:\s{2,}|[,;|]\s*|\s+[-–—]\s+)(\d+\s*[×xх]\s*.+|(\d+)\s*(?:мин|сек).*)$/i);
    if (match && match[1].trim().length > 1) {
      exercises.push(withMuscle({ name: match[1].trim(), scheme: match[2].trim() }));
      return;
    }
    if (lines.length <= 40 && line.length > 2 && line.length < 80 && /[A-Za-zА-Яа-яЁё]/.test(line)) {
      exercises.push(withMuscle({ name: line.replace(/^\d+[\).\]]\s*/, "") }));
    }
  });
  if (!exercises.length) return null;
  return { title: fileTitle(fileName), subtitle: "", workouts: [{ title: "Тренировка 1", exercises: exercises }] };
}

function programFromJson(data, fileName) {
  if (validProgram(data)) return data;
  const list = Array.isArray(data) ? data : (data && Array.isArray(data.exercises) ? data.exercises : null);
  if (!list) return null;
  const exercises = list.filter((item) => item && typeof item === "object" && item.name).map((item) => withMuscle({
    name: String(item.name),
    section: item.section || "",
    scheme: item.scheme || "",
    rir: item.rir || "",
    rest: item.rest || "",
    weight: item.weight || "",
    muscle: item.muscle,
    muscles: item.muscles,
    muscleLabel: item.muscleLabel
  }));
  if (!exercises.length) return null;
  return {
    title: (data && data.title) || fileTitle(fileName),
    subtitle: (data && data.subtitle) || "",
    workouts: [{ title: "Тренировка 1", exercises: exercises }]
  };
}

async function sheetsFromXlsx(bytes) {
  const files = await unzip(bytes);
  const sharedFile = files.get("xl/sharedStrings.xml");
  const shared = sharedFile ? parseSharedStrings(new TextDecoder().decode(sharedFile)) : [];
  const names = [...files.keys()].filter((name) => /^xl\/worksheets\/sheet\d+\.xml$/.test(name));
  names.sort((a, b) => Number(a.match(/\d+/)) - Number(b.match(/\d+/)));
  if (!names.length) throw new Error("В файле нет листа Excel. Сохрани таблицу как .xlsx.");
  return names.map((name) => parseSheet(new TextDecoder().decode(files.get(name)), shared));
}

async function programFromBuffer(fileName, bytes) {
  const name = String(fileName || "");
  const zip = bytes.length > 4 && bytes[0] === 0x50 && bytes[1] === 0x4b;
  const ole = bytes.length > 4 && bytes[0] === 0xd0 && bytes[1] === 0xcf;
  if (ole) throw new Error("Старый .xls не читается. Сохрани таблицу как .xlsx.");
  if (zip) {
    const sheets = await sheetsFromXlsx(bytes);
    const merged = { title: "", subtitle: "", workouts: [] };
    sheets.forEach((rows) => {
      const program = programFromRows(rows, name);
      if (!merged.title) merged.title = program.title;
      if (!merged.subtitle) merged.subtitle = program.subtitle;
      merged.workouts.push(...program.workouts);
    });
    if (!validProgram(merged)) throw new Error("В таблице не нашлось упражнений. Нужны столбцы «Упражнение» и «Подх × повт».");
    return merged;
  }
  const text = decodeText(bytes).trim();
  if (text.startsWith("{") || text.startsWith("[")) {
    let data;
    try { data = JSON.parse(text); } catch (err) { throw new Error("JSON повреждён."); }
    const program = programFromJson(data, name);
    if (!program || !validProgram(program)) throw new Error("В JSON нет упражнений.");
    return program;
  }
  const table = parseCsv(text);
  const fromTable = programFromRows(table, name);
  if (validProgram(fromTable)) return fromTable;
  const loose = programFromLooseText(text, name);
  if (loose && validProgram(loose)) return loose;
  throw new Error("Файл не разобран. Подойдёт Excel, CSV или JSON со списком упражнений.");
}

async function readProgramFile(file) {
  const bytes = new Uint8Array(await file.arrayBuffer());
  return programFromBuffer(file.name, bytes);
}

  function bindImages(root) {

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function partColor(part) {
    if (part === "warm") return "#2fbf4f";
    if (part === "cool" || part === "cardio") return "#e23d3d";
    return "#f5c400";
  }

  function syncRule(deck) {
    const cover = document.querySelector(".cover");
    if (!cover) return;
    const cards = deck ? Array.from(deck.querySelectorAll(".lens-card")) : [];
    if (!cards.length) {
      cover.style.setProperty("--rule", "#f5c400");
      cover.style.setProperty("--rule-b", "#f5c400");
      cover.style.setProperty("--mix", "0%");
      return;
    }
    const view = deck.getBoundingClientRect();
    const center = view.left + view.width / 2;
    const points = cards.map((card) => {
      const rect = card.getBoundingClientRect();
      return { color: partColor(card.dataset.part), x: rect.left + rect.width / 2 };
    }).sort((a, b) => a.x - b.x);
    let left = points[0];
    let right = points[0];
    if (center <= points[0].x) {
      left = right = points[0];
    } else if (center >= points[points.length - 1].x) {
      left = right = points[points.length - 1];
    } else {
      for (let i = 0; i < points.length - 1; i++) {
        if (points[i].x <= center && points[i + 1].x >= center) {
          left = points[i];
          right = points[i + 1];
          break;
        }
      }
    }
    const span = right.x - left.x;
    const mix = span > 1 ? ((center - left.x) / span) * 100 : 0;
    cover.style.setProperty("--rule", left.color);
    cover.style.setProperty("--rule-b", right.color);
    cover.style.setProperty("--mix", Math.round(mix * 10) / 10 + "%");
  }

      valueBtn.addEventListener("click", () => {

        input.className = "weight-input";
        input.inputMode = "decimal";
        input.enterKeyHint = "done";
        input.setAttribute("aria-label", "Вес, кг");
        const current = parseWeight(ex.weight);

        let cancel = false;

        input.focus();

        input.addEventListener("keydown", (event) => {

        });
        input.addEventListener("blur", () => {
          if (!cancel) write(parseWeight(input.value));
          input.remove();
          valueBtn.hidden = false;
          paintWeight(box, ex);
        });
      });
    });
  }

  function layoutDeck(deck) {
    syncRule(deck);
    if (reduceMotion) return;
    const cards = Array.from(deck.querySelectorAll(".lens-card"));
    if (!cards.length) return;
    const view = deck.getBoundingClientRect();
    if (view.width < 40) return;
    const center = view.left + view.width / 2;
    const cardWidth = cards[0].getBoundingClientRect().width;
    const maxDistance = cardWidth + 20;
    cards.forEach((card) => {
      const rect = card.getBoundingClientRect();
      const cardCenter = rect.left + rect.width / 2;
      const distance = Math.min(center - cardCenter, maxDistance);
      const ratio = (maxDistance - Math.abs(distance)) / maxDistance;
      const progress = Math.min(1, Math.max(0, ratio));
      const top = card.querySelector(".lens-top");
      const topH = top ? top.getBoundingClientRect().height : 188;
      const offset = topH - progress * topH;
      const body = card.querySelector(".lens-body");
      if (body) body.style.transform = "translateY(" + (-offset) + "px)";
    });
  }

  function bindDecks(root) {
    root.querySelectorAll("[data-deck]").forEach((deck) => {
      if (deck.dataset.bound === "1") return;
      deck.dataset.bound = "1";
      deck.addEventListener("scroll", () => layoutDeck(deck), { passive: true });
      const next = deck.parentElement && deck.parentElement.querySelector(".deck-next");
      if (next) {
        next.addEventListener("click", () => {
          const card = deck.querySelector(".lens-card");
          if (!card) return;
          const step = card.getBoundingClientRect().width + 20;
          const max = deck.scrollWidth - deck.clientWidth;
          const target = deck.scrollLeft >= max - 8 ? 0 : deck.scrollLeft + step;
          deck.scrollTo({ left: target, behavior: "smooth" });
        });
      }
      deck.addEventListener("keydown", (event) => {
        const card = deck.querySelector(".lens-card");
        if (!card) return;
        const step = card.getBoundingClientRect().width + 20;
        if (event.key !== "ArrowRight" && event.key !== "ArrowLeft") return;
        event.preventDefault();
        deck.scrollBy({ left: event.key === "ArrowRight" ? step : -step, behavior: "smooth" });
      });
      layoutDeck(deck);
    });
  }

  function placeDaysThumb() {
    if (!daysEl || !daysScroll || !daysThumb) return;
    const overflow = daysEl.scrollWidth - daysEl.clientWidth;
    daysScroll.hidden = overflow <= 8;
    if (overflow <= 8) return;
    const width = Math.max(28, daysScroll.clientWidth * (daysEl.clientWidth / daysEl.scrollWidth));
    const max = Math.max(0, daysScroll.clientWidth - width);
    const left = (daysEl.scrollLeft / overflow) * max;
    daysThumb.style.width = width + "px";
    daysThumb.style.transform = "translateX(" + left + "px)";
  }

  function renderDayButtons() {
    daysEl.replaceChildren();
    (program.workouts || []).forEach((workout, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "day" + (index === selectedDay ? " on" : "");
      button.textContent = workout.title || ("День " + (index + 1));
      button.addEventListener("click", () => {
        selectedDay = index;
        renderDayButtons();
        showSelectedDay();
      });
      daysEl.append(button);
    });
    requestAnimationFrame(placeDaysThumb);
  }

  function showSelectedDay() {
    const workouts = program && program.workouts || [];
    if (!workouts.length) {
      dayPage.innerHTML = "";
      return;
    }
    if (selectedDay >= workouts.length) selectedDay = 0;
    dayPage.innerHTML = renderDay(workouts[selectedDay]);
    bindImages(dayPage);
    bindWeights(dayPage);
    bindDecks(dayPage);
    requestAnimationFrame(() => {
      dayPage.querySelectorAll("[data-deck]").forEach(layoutDeck);
    });
  }

  function paint(next) {
    program = next;
    if (selectedDay >= (program.workouts || []).length) selectedDay = 0;
    titleEl.textContent = program.title || "Тренировки";
    subEl.textContent = program.subtitle || "";
    document.title = "Heft";
    renderDayButtons();
    showSelectedDay();
  }

  daysEl.addEventListener("scroll", placeDaysThumb, { passive: true });

  window.addEventListener("resize", () => {
    dayPage.querySelectorAll("[data-deck]").forEach(layoutDeck);
    placeDaysThumb();
  });

  try {
    const saved = localStorage.getItem(KEY);
    if (saved) {
      const data = JSON.parse(saved);
      if (validProgram(data)) {
        paint(data);
        showBook();
      }
    }
  } catch (err) {
    /* Quick Look and private mode have no storage. The printed book stays. */
  }

  fileInput.addEventListener("change", async () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file) return;
    setStatus("Читаю файл…", false);
    try {
      const data = await readProgramFile(file);
      if (!validProgram(data)) throw new Error("Файл не разобран. Подойдёт Excel, CSV или JSON со списком упражнений.");
      localStorage.setItem(KEY, JSON.stringify(data));
      selectedDay = 0;
      paint(data);
      showBook();
      const count = data.workouts.reduce((sum, workout) => sum + workout.exercises.filter((ex) => ex && ex.name).length, 0);
      setStatus("Разобрано: " + data.workouts.length + " " + plural(data.workouts.length, "тренировка", "тренировки", "тренировок")
        + (count ? ", " + count + " " + plural(count, "упражнение", "упражнения", "упражнений") : ""), true);
    } catch (err) {
      setStatus((err && err.message) || "Файл не разобран. Подойдёт Excel, CSV или JSON со списком упражнений.", false);
    }
    fileInput.value = "";
  });

  resetBtn.addEventListener("click", () => {
    try { localStorage.removeItem(KEY); } catch (err) { /* ignore */ }
    program = null;
    selectedDay = 0;
    setStatus("");
    showGate();
  });

  manualBtn.addEventListener("click", startManual);
  editBtn.addEventListener("click", openEditor);
  doneBtn.addEventListener("click", closeEditor);
  addDayBtn.addEventListener("click", addDay);

  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  }
})();

</script>
</body>
</html>
