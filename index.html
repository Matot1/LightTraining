<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0d0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Тренировки">
<title>Тренировки</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
:root {
  color-scheme: dark;
  --bg: #0e0d0b;
  --ink: #f3eadc;
  --muted: #b7ad9e;
  --gold: #e0c48a;
  --line: rgba(243, 234, 220, 0.14);
  --soft: rgba(224, 196, 138, 0.08);
  interpolate-size: allow-keywords;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100dvh;
  background:
    radial-gradient(900px 420px at 50% -12%, #2a241c 0%, transparent 58%),
    var(--bg);
  color: var(--ink);
  font-family: ui-serif, Georgia, "Iowan Old Style", Palatino, serif;
  font-size: 17px;
  line-height: 1.4;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0.045;
  background-image: radial-gradient(#fff 0.6px, transparent 0.6px);
  background-size: 3px 3px;
}

button, summary, label { -webkit-tap-highlight-color: transparent; }

.book {
  position: relative;
  width: min(480px, 100%);
  margin: 0 auto;
  padding:
    calc(28px + env(safe-area-inset-top))
    22px
    calc(32px + env(safe-area-inset-bottom));
}

.kicker {
  margin: 0 0 10px;
  font-family: ui-sans-serif, system-ui, sans-serif;
  font-size: 12px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold);
}

h1 {
  margin: 0;
  font-weight: 500;
  font-size: 52px;
  line-height: 0.92;
  letter-spacing: -0.03em;
}

.subtitle {
  margin: 10px 0 0;
  color: var(--muted);
  font-style: italic;
  font-size: 18px;
}

.subtitle:empty { display: none; }

.cover::after {
  content: "";
  display: block;
  height: 1px;
  margin-top: 20px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  opacity: 0.75;
}

.chapter { border-top: 1px solid var(--line); }
.chapter:first-child { border-top: 0; }

summary {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 64px;
  padding: 14px 0;
  list-style: none;
  cursor: pointer;
}

summary::-webkit-details-marker { display: none; }

summary:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
}

summary:active { background: var(--soft); }

.num {
  flex: none;
  width: 2.1em;
  font-size: 18px;
  color: var(--gold);
}

.titles {
  display: flex;
  flex-direction: column;
  gap: 3px;
  flex: 1;
  min-width: 0;
}

.name,
.ex-copy h2,
.info,
.fine,
.cues li {
  overflow-wrap: break-word;
}

.name {
  font-size: 21px;
  letter-spacing: -0.02em;
}

.count {
  font-family: ui-sans-serif, system-ui, sans-serif;
  font-size: 12px;
  letter-spacing: 0.02em;
  color: var(--muted);
}

.mark {
  flex: none;
  width: 8px;
  height: 8px;
  margin-top: -4px;
  border-right: 1.5px solid currentColor;
  border-bottom: 1.5px solid currentColor;
  transform: rotate(45deg);
}

details[open] > summary .mark {
  margin-top: 4px;
  transform: rotate(225deg);
}

.page { padding: 0 0 8px; }

.info {
  margin: 0 0 18px;
  color: var(--muted);
  font-style: italic;
  font-size: 17px;
}

.exercise + .exercise {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
}

.deck-clip {
  container-type: inline-size;
  margin: 4px -22px 0;
}

.deck {
  display: flex;
  gap: 20px;
  padding: 4px 30px 8px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scroll-padding-inline: 30px;
  overscroll-behavior-x: contain;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.deck::-webkit-scrollbar { display: none; }

.deck:focus-visible { outline: none; }

.lens-card {
  --top: 188px;
  position: relative;
  flex: 0 0 calc(100cqi - 60px);
  height: min(520px, 68vh);
  min-height: 420px;
  overflow: hidden;
  scroll-snap-align: center;
  background: #141210;
  border: 1px solid var(--line);
}

.lens-top {
  display: flex;
  align-items: center;
  justify-content: center;
  height: var(--top);
  padding: 8px 8px 0;
}

.lens-top .plates svg { width: 74px; }

.lens-top-plain p {
  margin: 0;
  font-size: 34px;
  line-height: 1.1;
  text-align: center;
  white-space: pre-line;
}

.lens-body {
  position: absolute;
  left: 0;
  right: 0;
  top: var(--top);
  height: 100%;
  padding: 16px 16px 28px;
  overflow: auto;
  background: #1b1814;
  border-top: 1px solid rgba(224, 196, 138, 0.35);
  transform: translateY(calc(var(--top) * -1));
}

.lens-kicker {
  margin: 0 0 8px;
  font-family: ui-sans-serif, system-ui, sans-serif;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--gold);
}

.deck-hint {
  margin: 8px 0 0;
  text-align: center;
  font-family: ui-sans-serif, system-ui, sans-serif;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}

.section-label {
  margin: 20px 0 4px;
  font-family: ui-sans-serif, system-ui, sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--gold);
}

.section-label:first-child { margin-top: 0; }

.note {
  margin: 0 0 12px;
  font-size: 16px;
  line-height: 1.45;
}

.count:empty { display: none; }

.ex-top {
  display: grid;
  grid-template-columns: 124px minmax(0, 1fr);
  gap: 12px;
  align-items: start;
}

.ex-top.plain { grid-template-columns: minmax(0, 1fr); }

.plates {
  display: flex;
  gap: 6px;
}

.plates figure { margin: 0; }

.plates figure.dim { opacity: 0.34; }

.plates svg {
  display: block;
  width: 56px;
  height: auto;
}

.plates figcaption {
  margin-top: 4px;
  text-align: center;
  font-family: ui-sans-serif, system-ui, sans-serif;
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}

.atlas .skin { fill: #241f1b; }
.atlas .outline { fill: none; stroke: #6e655a; stroke-width: 1.3; }
.atlas .head { fill: #241f1b; stroke: #6e655a; stroke-width: 1.3; }
.atlas .m { fill: #3c362f; }
.atlas .m.on { fill: #e0c48a; }

.ex-copy { min-width: 0; padding-top: 2px; }

.ex-copy h2 {
  margin: 0;
  font-size: 22px;
  font-weight: 500;
  line-height: 1.15;
  letter-spacing: -0.02em;
}

.muscle {
  margin: 4px 0 0;
  color: var(--gold);
  font-style: italic;
  font-size: 16px;
}

.prescription {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin: 8px 0 0;
}

.prescription .n {
  font-size: 36px;
  line-height: 0.9;
  font-weight: 500;
}

.prescription .r {
  font-size: 18px;
  color: var(--muted);
}

.scheme {
  margin: 8px 0 0;
  font-size: 20px;
  line-height: 1.3;
  white-space: pre-line;
}

.word {
  margin: 4px 0 0;
  font-family: ui-sans-serif, system-ui, sans-serif;
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}

.spoiler {
  margin-top: 12px;
  border-top: 1px solid var(--line);
}

.spoiler summary {
  min-height: 48px;
  color: var(--gold);
  font-family: ui-sans-serif, system-ui, sans-serif;
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.how { padding: 0 0 14px; }

.frames {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.frames figure { margin: 0; }

.frames svg {
  display: block;
  width: 100%;
  height: auto;
  background: #141210;
  border: 1px solid var(--line);
}

.etch .ink {
  fill: none;
  stroke: #e7dccb;
  stroke-width: 2px;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.etch .head {
  fill: #141210;
  stroke: #e7dccb;
  stroke-width: 2px;
  vector-effect: non-scaling-stroke;
}

.etch .gold {
  fill: none;
  stroke: #e4c98a;
  stroke-width: 2px;
  stroke-linecap: round;
  vector-effect: non-scaling-stroke;
}

.etch .plate {
  fill: none;
  stroke: #e4c98a;
  stroke-width: 1.6px;
  vector-effect: non-scaling-stroke;
}

.etch .prop {
  fill: none;
  stroke: #6d6458;
  stroke-width: 1.5px;
  stroke-linecap: round;
  vector-effect: non-scaling-stroke;
}

.etch .joint { fill: #e7dccb; stroke: none; }

.frames figcaption {
  margin-top: 6px;
  text-align: center;
  font-family: ui-sans-serif, system-ui, sans-serif;
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}

.cues {
  margin: 12px 0 0;
  padding: 0;
  list-style: none;
}

.cues li {
  margin: 0 0 6px;
  color: var(--ink);
  font-size: 16px;
}

.cues li::before {
  content: "— ";
  color: var(--gold);
}

.shots img {
  display: block;
  width: 100%;
  height: auto;
  margin-bottom: 8px;
  border: 1px solid var(--line);
}

.colophon {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 10px;
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
}

.load {
  display: block;
  width: fit-content;
  max-width: 100%;
  padding: 12px 14px;
  border: 1px solid rgba(224, 196, 138, 0.45);
  color: var(--gold);
  font-family: ui-sans-serif, system-ui, sans-serif;
  font-size: 13px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.load input { display: none; }

.linkish {
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  color: var(--muted);
  font-family: ui-serif, Georgia, serif;
  font-style: italic;
  font-size: 16px;
}

.fine {
  margin: 0;
  color: var(--muted);
  font-style: italic;
  font-size: 15px;
}

#status {
  margin: 0;
  color: #e7b2a4;
  font-family: ui-sans-serif, system-ui, sans-serif;
  font-size: 14px;
}

#status:empty { display: none; }

@media (max-width: 360px) {
  h1 { font-size: 44px; }
  .ex-top { grid-template-columns: 108px 1fr; }
  .plates svg { width: 48px; }
  .name, .ex-copy h2 { font-size: 19px; }
}

@media (prefers-reduced-motion: reduce) {
  .deck {
    display: block;
    overflow: visible;
    padding: 0;
    margin: 0;
  }

  .deck-clip { margin: 0; }

  .lens-card {
    width: 100%;
    height: auto;
    min-height: 0;
    margin-bottom: 14px;
  }

  .lens-top { height: auto; }

  .lens-body {
    position: relative;
    top: auto;
    height: auto;
    transform: none !important;
  }
}

</style>
</head>
<body>
<div class="book">
  <header class="cover">
    <p class="kicker">Книга тренировок</p>
    <h1 id="book-title">Тренировки</h1>
    <p class="subtitle" id="book-sub">Программа хранится на телефоне</p>
  </header>
  <main id="chapters">
    <article class="chapter">
      <details>
        <summary>
          <span class="num">I</span>
          <span class="titles">
            <span class="name">Книга</span>
            <span class="count"></span>
          </span>
          <span class="mark" aria-hidden="true"></span>
        </summary>
        <div class="page"><p class="note">Своя программа на GitHub не хранится.</p></div>
      </details>
    </article>
  </main>
  <footer class="colophon">
    <label class="load">Загрузить программу
      <input id="file" type="file" accept="application/json,.json">
    </label>
    <button id="reset" class="linkish" type="button" hidden>Вернуть пример</button>
    <p id="status"></p>
    <p class="fine">Свой файл остаётся на этом телефоне.</p>
  </footer>
</div>
<script type="application/json" id="default-program">{"title":"Тренировки","subtitle":"Программа хранится на телефоне","workouts":[{"title":"Книга","exercises":[],"text":"Своя программа на GitHub не хранится."}]}</script>
<script>
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[ch]));
}

const MUSCLE_LABELS = {
  chest: "Грудь",
  back: "Спина",
  shoulders: "Плечи",
  biceps: "Бицепс",
  triceps: "Трицепс",
  abs: "Пресс",
  quads: "Квадрицепс",
  hamstrings: "Бицепс бедра",
  glutes: "Ягодицы",
  calves: "Икры",
  legs: "Ноги"
};

const MUSCLE_ALIAS = {
  pecs: "chest",
  chest: "chest",
  грудь: "chest",
  back: "back",
  lats: "back",
  спина: "back",
  shoulders: "shoulders",
  delts: "shoulders",
  плечи: "shoulders",
  biceps: "biceps",
  бицепс: "biceps",
  triceps: "triceps",
  трицепс: "triceps",
  abs: "abs",
  пресс: "abs",
  quads: "quads",
  квадрицепс: "quads",
  hamstrings: "hamstrings",
  "бицепс бедра": "hamstrings",
  glutes: "glutes",
  ягодицы: "glutes",
  calves: "calves",
  икры: "calves",
  legs: "legs",
  ноги: "legs"
};

const BODY = "M32 36 C22 38 16 46 16 56 L14 90 C14 97 19 101 25 98 L27 68 L31 62 L33 98 C29 108 27 122 29 140 L27 162 C27 166 31 168 35 168 L40 136 L45 168 C49 168 53 166 53 162 L51 140 C53 122 51 108 47 98 L49 62 L53 68 L55 98 C61 101 66 97 66 90 L64 56 C64 46 58 38 48 36 C42 32 38 32 32 36 Z";

let figureUid = 0;

function normMuscle(value) {
  if (typeof value !== "string") return "";
  const key = value.trim().toLowerCase();
  return MUSCLE_ALIAS[key] || key;
}

function expandMuscles(ids) {
  const out = new Set();
  ids.forEach((id) => {
    if (id === "legs") ["quads", "hamstrings", "glutes", "calves"].forEach((part) => out.add(part));
    else if (id) out.add(id);
  });
  return out;
}

function muscleLabel(ex) {
  if (ex && typeof ex.muscleLabel === "string" && ex.muscleLabel.trim()) return ex.muscleLabel.trim();
  const id = normMuscle(ex && ex.muscle);
  return MUSCLE_LABELS[id] || (ex && typeof ex.muscle === "string" ? ex.muscle : "");
}

function atlasSvg(ids) {
  const on = expandMuscles(ids.map(normMuscle));
  const n = ++figureUid;
  const hot = (id) => (on.has(id) ? "m on" : "m");
  const frontIds = ["chest", "abs", "shoulders", "biceps", "quads", "calves"];
  const backIds = ["back", "shoulders", "triceps", "glutes", "hamstrings", "calves"];
  const frontHot = frontIds.some((id) => on.has(id));
  const backHot = backIds.some((id) => on.has(id));

  function body(side) {
    const clip = side + n;
    const muscles = side === "f"
      ? `
        <ellipse class="${hot("shoulders")}" cx="22" cy="52" rx="8" ry="7"/>
        <ellipse class="${hot("shoulders")}" cx="58" cy="52" rx="8" ry="7"/>
        <ellipse class="${hot("chest")}" cx="40" cy="62" rx="14" ry="9"/>
        <ellipse class="${hot("biceps")}" cx="20" cy="78" rx="4.5" ry="10"/>
        <ellipse class="${hot("biceps")}" cx="60" cy="78" rx="4.5" ry="10"/>
        <ellipse class="${hot("abs")}" cx="40" cy="86" rx="6" ry="12"/>
        <ellipse class="${hot("quads")}" cx="35" cy="128" rx="6" ry="16"/>
        <ellipse class="${hot("quads")}" cx="45" cy="128" rx="6" ry="16"/>
        <ellipse class="${hot("calves")}" cx="33" cy="154" rx="4" ry="8"/>
        <ellipse class="${hot("calves")}" cx="47" cy="154" rx="4" ry="8"/>`
      : `
        <ellipse class="${hot("shoulders")}" cx="22" cy="52" rx="8" ry="7"/>
        <ellipse class="${hot("shoulders")}" cx="58" cy="52" rx="8" ry="7"/>
        <ellipse class="${hot("back")}" cx="40" cy="58" rx="10" ry="6"/>
        <ellipse class="${hot("back")}" cx="40" cy="76" rx="15" ry="12"/>
        <ellipse class="${hot("triceps")}" cx="19" cy="76" rx="4.5" ry="10"/>
        <ellipse class="${hot("triceps")}" cx="61" cy="76" rx="4.5" ry="10"/>
        <ellipse class="${hot("glutes")}" cx="34" cy="108" rx="7" ry="6"/>
        <ellipse class="${hot("glutes")}" cx="46" cy="108" rx="7" ry="6"/>
        <ellipse class="${hot("hamstrings")}" cx="35" cy="130" rx="5.5" ry="14"/>
        <ellipse class="${hot("hamstrings")}" cx="45" cy="130" rx="5.5" ry="14"/>
        <ellipse class="${hot("calves")}" cx="33" cy="154" rx="4" ry="8"/>
        <ellipse class="${hot("calves")}" cx="47" cy="154" rx="4" ry="8"/>`;
    return `<svg class="atlas" viewBox="0 0 80 176" role="img">
      <defs><clipPath id="${clip}"><path d="${BODY}"/></clipPath></defs>
      <g clip-path="url(#${clip})">
        <rect class="skin" x="0" y="0" width="80" height="176"/>
        ${muscles}
      </g>
      <path class="outline" d="${BODY}"/>
      <circle class="head" cx="40" cy="20" r="12"/>
    </svg>`;
  }

  const label = ids.map((id) => MUSCLE_LABELS[normMuscle(id)] || id).filter(Boolean).join(", ");
  return `<div class="plates" aria-label="${esc(label || "мышцы")}">
    <figure class="${frontHot ? "" : "dim"}">${body("f")}<figcaption>спереди</figcaption></figure>
    <figure class="${backHot ? "" : "dim"}">${body("b")}<figcaption>сзади</figcaption></figure>
  </div>`;
}

function polar(x, y, deg, len) {
  const r = (deg * Math.PI) / 180;
  return [Math.round((x + Math.cos(r) * len) * 10) / 10, Math.round((y + Math.sin(r) * len) * 10) / 10];
}

function pose(over) {
  return Object.assign({
    shoulder: [80, 40],
    torso: 78,
    torsoLen: 50,
    thigh: 96,
    thighLen: 42,
    shin: 82,
    shinLen: 40,
    foot: 175,
    arm: 80,
    armLen: 30,
    fore: 86,
    foreLen: 28,
    face: 180,
    support: "floor",
    bar: "hands"
  }, over);
}

function barEnds(x, y) {
  return `<path class="gold" d="M${x - 16} ${y} H${x + 16} M${x - 16} ${y - 7} V${y + 7} M${x + 16} ${y - 7} V${y + 7}"/>`;
}

function poseParts(cfg) {
  const S = cfg.shoulder;
  const hip = polar(S[0], S[1], cfg.torso, cfg.torsoLen);
  const knee = polar(hip[0], hip[1], cfg.thigh, cfg.thighLen);
  const ankle = polar(knee[0], knee[1], cfg.shin, cfg.shinLen);
  const toe = polar(ankle[0], ankle[1], cfg.foot, 16);
  const heel = polar(ankle[0], ankle[1], cfg.foot + 180, 7);
  const elbow = polar(S[0], S[1], cfg.arm, cfg.armLen);
  const wrist = polar(elbow[0], elbow[1], cfg.fore, cfg.foreLen);
  const headDir = cfg.headDir == null ? cfg.torso + 180 : cfg.headDir;
  const head = polar(S[0], S[1], headDir, cfg.headDist || 16);
  const nose = polar(head[0], head[1], cfg.face, 13);
  const pts = [S, hip, knee, ankle, toe, heel, elbow, wrist, head, nose, [head[0] - 12, head[1] - 12], [head[0] + 12, head[1] + 12]];

  let prop = "";
  if (cfg.support === "bench") {
    const y = Math.max(S[1], hip[1]) + 13;
    const x1 = Math.min(head[0], S[0]) - 16;
    const x2 = Math.max(hip[0], knee[0]) + 18;
    prop = `<path class="prop" d="M${x1} ${y} H${x2} M${x1 + 14} ${y} V${y + 16} M${x2 - 14} ${y} V${y + 16}"/>`;
    pts.push([x1, y], [x2, y + 16]);
  } else if (cfg.support === "incline") {
    const x1 = head[0] - 14;
    const y1 = S[1] + 16;
    const x2 = hip[0] + 16;
    const y2 = hip[1] + 12;
    prop = `<path class="prop" d="M${x1} ${y1} L${x2} ${y2} M${x1 + 8} ${y1 + 4} l-6 16 M${x2 - 10} ${y2} l6 16"/>`;
    pts.push([x1, y1], [x2, y2 + 16]);
  } else if (cfg.support === "seat") {
    const y = hip[1] + 6;
    const xBack = Math.max(hip[0], S[0]) + 8;
    const xFront = Math.min(knee[0], hip[0]) - 6;
    prop = `<path class="prop" d="M${xFront} ${y} H${xBack} V${S[1] - 4} M${xBack - 10} ${y} V${y + 18}"/>`;
    pts.push([xFront, y + 18], [xBack, S[1] - 4]);
  } else if (cfg.support === "press") {
    const seatY = hip[1] + 8;
    const plateX = Math.min(toe[0], ankle[0]) - 10;
    const plateTop = Math.min(toe[1], ankle[1], knee[1]) - 8;
    const plateBot = Math.max(toe[1], ankle[1], knee[1]) + 10;
    prop = `<path class="prop" d="M${hip[0] - 18} ${seatY} H${hip[0] + 22} M${S[0] + 2} ${S[1] + 6} L${hip[0] + 14} ${seatY}"/>`;
    prop += `<path class="gold" d="M${plateX} ${plateTop} L${plateX + 4} ${plateBot}"/>`;
    pts.push([hip[0] - 18, seatY], [S[0], S[1]], [plateX, plateTop], [plateX, plateBot]);
  } else {
    const y = Math.max(ankle[1], toe[1], heel[1]) + 3;
    const x1 = Math.min(toe[0], heel[0], head[0], wrist[0]) - 18;
    const x2 = Math.max(toe[0], heel[0], hip[0], wrist[0]) + 18;
    prop = `<path class="prop" d="M${x1} ${y} H${x2}"/>`;
    pts.push([x1, y], [x2, y]);
  }

  let bar = "";
  if (cfg.bar === "dumbbell") {
    const a = polar(wrist[0], wrist[1], 35, 9);
    const b = polar(wrist[0], wrist[1], 215, 9);
    pts.push(a, b);
    bar = `<path class="gold" d="M${a[0]} ${a[1]} L${b[0]} ${b[1]}"/>`;
  } else if (cfg.bar === "back") {
    const x = S[0];
    const y = S[1] - 6;
    pts.push([x - 24, y - 10], [x + 24, y + 10]);
    bar = barEnds(x, y);
  } else if (cfg.bar !== "none") {
    const x = wrist[0];
    const y = wrist[1];
    pts.push([x - 24, y - 10], [x + 24, y + 10]);
    bar = barEnds(x, y);
  }

  const body = `<path class="ink" d="M${S[0]} ${S[1]} L${hip[0]} ${hip[1]} L${knee[0]} ${knee[1]} L${ankle[0]} ${ankle[1]} L${toe[0]} ${toe[1]} M${ankle[0]} ${ankle[1]} L${heel[0]} ${heel[1]}"/>
    <path class="ink" d="M${S[0]} ${S[1]} L${elbow[0]} ${elbow[1]} L${wrist[0]} ${wrist[1]}"/>
    <circle class="head" cx="${head[0]}" cy="${head[1]}" r="10"/>
    <path class="ink" d="M${head[0]} ${head[1]} L${nose[0]} ${nose[1]}"/>`;
  return { prop, body, bar, pts };
}

function viewBoxOf(pts) {
  let minX = Infinity;
  let minY = Infinity;
  let maxX = -Infinity;
  let maxY = -Infinity;
  pts.forEach((p) => {
    minX = Math.min(minX, p[0]);
    minY = Math.min(minY, p[1]);
    maxX = Math.max(maxX, p[0]);
    maxY = Math.max(maxY, p[1]);
  });
  const pad = 16;
  return `${minX - pad} ${minY - pad} ${maxX - minX + pad * 2} ${maxY - minY + pad * 2}`;
}

function poseSvg(parts, viewBox) {
  return `<svg class="etch" viewBox="${viewBox}" role="img">${parts.prop}${parts.body}${parts.bar}</svg>`;
}

const POSES = {

    end: pose({ shoulder: [46, 86], torso: 18, torsoLen: 52, thigh: 198, thighLen: 44, shin: 198, shinLen: 40, foot: 190, face: -50, arm: 40, armLen: 20, fore: 16, foreLen: 16, support: "press", bar: "none" })

function diagramBlock(name) {
  const item = POSES[name];
  if (!item) return "";
  const start = poseParts(item.start);
  const end = poseParts(item.end);
  const viewBox = viewBoxOf(start.pts.concat(end.pts));
  return `<div class="frames">
    <figure>${poseSvg(start, viewBox)}<figcaption>Старт</figcaption></figure>
    <figure>${poseSvg(end, viewBox)}<figcaption>Финиш</figcaption></figure>
  </div>`;
}

function plural(n, one, few, many) {
  const n10 = n % 10;
  const n100 = n % 100;
  if (n10 === 1 && n100 !== 11) return one;
  if (n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) return few;
  return many;
}

function roman(n) {
  const map = ["", "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII", "XIII", "XIV", "XV", "XVI", "XVII", "XVIII", "XIX", "XX"];
  return map[n] || String(n);
}

function validProgram(data) {
  return Boolean(data && Array.isArray(data.workouts) && data.workouts.length
    && data.workouts.every((workout) => workout && typeof workout.title === "string" && Array.isArray(workout.exercises)));
}

function cleanMeta(value) {
  if (typeof value !== "string") return "";
  const text = value.trim();
  if (!text || text === "—") return "";
  return text;
}

function parseScheme(scheme) {
  const raw = String(scheme || "").trim();
  if (!raw) return { kind: "empty" };
  if (raw.includes("+") || /разм/i.test(raw)) return { kind: "block", text: raw };
  const match = raw.match(/^(\d+)\s*[×xх]\s*(.+)$/);
  if (match) return { kind: "simple", n: Number(match[1]), reps: match[2].trim() };
  return { kind: "block", text: raw };
}

function workingSets(ex) {
  if (typeof ex.sets === "number" && isFinite(ex.sets)) return ex.sets;
  const scheme = String(ex.scheme || ex.sets || "");
  const plus = scheme.match(/\+\s*(\d+)\s*[×xх]/);
  if (plus) return Number(plus[1]);
  const first = scheme.match(/(\d+)\s*[×xх]/);
  return first ? Number(first[1]) : 0;
}

function setsCount(ex) {
  return workingSets(ex);
}

function safeSrc(src) {
  if (typeof src !== "string") return "";
  const value = src.trim();
  if (!value || value.length > 2000000) return "";
  if (value.startsWith("images/") || value.startsWith("./images/") || value.startsWith("/images/")) return value;
  if (value.startsWith("data:image/")) return value;
  try {
    const url = new URL(value);
    if (url.protocol === "https:" || url.protocol === "http:") return value;
  } catch (err) {
    return "";
  }
  return "";
}

function imagesBlock(ex) {
  const raw = ex.images ?? ex.image ?? [];
  const list = (Array.isArray(raw) ? raw : [raw]).map(safeSrc).filter(Boolean);
  if (!list.length) return "";
  return `<div class="shots">${list.map((src) => `<img src="${esc(src)}" alt="${esc(ex.name || "Упражнение")}">`).join("")}</div>`;
}

function spoiler(ex) {
  const shots = imagesBlock(ex);
  const diagram = shots ? "" : diagramBlock(ex.diagram);
  const cues = Array.isArray(ex.cues) ? ex.cues.filter((cue) => typeof cue === "string" && cue.trim()) : [];
  if (!shots && !diagram && !cues.length) return "";
  const cuesHtml = cues.length
    ? `<ul class="cues">${cues.map((cue) => `<li>${esc(cue)}</li>`).join("")}</ul>`
    : "";
  return `<details class="spoiler">
    <summary><span>Как выполнять</span><span class="mark" aria-hidden="true"></span></summary>
    <div class="how">${shots}${diagram}${cuesHtml}</div>
  </details>`;
}

function muscleIds(ex) {
  const list = Array.isArray(ex.muscles) && ex.muscles.length ? ex.muscles : [ex.muscle];
  return list.map(normMuscle).filter(Boolean);
}

function schemeOf(ex) {
  return parseScheme(ex.scheme || (ex.sets != null ? `${ex.sets}${ex.reps ? "×" + ex.reps : ""}` : ""));
}

function exerciseHtml(ex, index, total) {
  const ids = muscleIds(ex);
  const label = muscleLabel(ex);
  const scheme = schemeOf(ex);
  const bits = [];
  if (scheme.kind === "simple") bits.push(plural(scheme.n, "подход", "подхода", "подходов"));
  const rir = cleanMeta(ex.rir);
  const rest = cleanMeta(ex.rest);
  if (rir) bits.push("RIR " + rir);
  if (rest) bits.push("отдых " + rest);
  const prescription = scheme.kind === "simple"
    ? `<p class="prescription"><span class="n">${esc(String(scheme.n))}</span><span class="r">× ${esc(scheme.reps)}</span></p>`
    : (scheme.kind === "block" ? `<p class="scheme">${esc(scheme.text)}</p>` : "");
  const kicker = [ex.section, total ? `${index + 1} / ${total}` : ""].filter(Boolean).join(" · ");
  const plainTop = scheme.kind === "block" ? scheme.text : (scheme.kind === "simple" ? `${scheme.n} × ${scheme.reps}` : (ex.section || ""));
  const top = ids.length
    ? `<div class="lens-top">${atlasSvg(ids)}</div>`
    : `<div class="lens-top lens-top-plain"><p>${esc(plainTop)}</p></div>`;
  return `<article class="lens-card">
    ${top}
    <div class="lens-body">
      ${kicker ? `<p class="lens-kicker">${esc(kicker)}</p>` : ""}
      <h2>${esc(ex.name || "Упражнение")}</h2>
      ${label ? `<p class="muscle">${esc(label)}</p>` : ""}
      ${prescription}
      ${bits.length ? `<p class="word">${esc(bits.join(" · "))}</p>` : ""}
      ${spoiler(ex)}
    </div>
  </article>`;
}

function deckHtml(exercises) {
  return `<div class="deck-clip"><div class="deck" data-deck tabindex="0">${exercises.map((ex, index) => exerciseHtml(ex, index, exercises.length)).join("")}</div></div><p class="deck-hint">Листай карточки вбок</p>`;
}

function renderChapters(program) {
  return program.workouts.map((workout, index) => {
    const exercises = workout.exercises.filter((ex) => ex && typeof ex === "object" && ex.name);
    const totalSets = exercises.reduce((sum, ex) => sum + setsCount(ex), 0);
    const bits = [`${exercises.length} ${plural(exercises.length, "упражнение", "упражнения", "упражнений")}`];
    if (totalSets) bits.push(`${totalSets} ${plural(totalSets, "подход", "подхода", "подходов")}`);
    const info = typeof workout.info === "string" && workout.info.trim()
      ? `<p class="info">${esc(workout.info.trim())}</p>`
      : "";
    const notes = typeof workout.text === "string"
      ? workout.text.split(/\n+/).map((line) => line.trim()).filter(Boolean).map((line) => `<p class="note">${esc(line)}</p>`).join("")
      : "";
    const body = exercises.length
      ? deckHtml(exercises)
      : (notes ? "" : `<p class="info">В этой тренировке пока нет упражнений.</p>`);
    const count = exercises.length ? bits.join(" · ") : "";
    return `<article class="chapter">
      <details>
        <summary>
          <span class="num">${roman(index + 1)}</span>
          <span class="titles">
            <span class="name">${esc(workout.title)}</span>
            <span class="count">${esc(count)}</span>
          </span>
          <span class="mark" aria-hidden="true"></span>
        </summary>
        <div class="page">${info}${notes}${body}</div>
      </details>
    </article>`;
  }).join("");
}

(function () {
  const chapters = document.getElementById("chapters");
  const titleEl = document.getElementById("book-title");
  const subEl = document.getElementById("book-sub");
  const fileInput = document.getElementById("file");
  const resetBtn = document.getElementById("reset");
  const status = document.getElementById("status");
  const KEY = "light-training-program-v2";

  function bindImages(root) {
    root.querySelectorAll("img").forEach((img) => {
      img.addEventListener("error", () => img.remove());
    });
  }

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function layoutDeck(deck) {
    if (reduceMotion) return;
    const cards = Array.from(deck.querySelectorAll(".lens-card"));
    if (!cards.length) return;
    const view = deck.getBoundingClientRect();
    if (view.width < 40) return;
    const center = view.left + view.width / 2;
    const cardWidth = cards[0].getBoundingClientRect().width;
    const maxDistance = cardWidth + 20;
    cards.forEach((card) => {
      const rect = card.getBoundingClientRect();
      const cardCenter = rect.left + rect.width / 2;
      const distance = Math.min(center - cardCenter, maxDistance);
      const ratio = (maxDistance - Math.abs(distance)) / maxDistance;
      const progress = Math.min(1, Math.max(0, ratio));
      const top = card.querySelector(".lens-top");
      const topH = top ? top.getBoundingClientRect().height : 188;
      const offset = topH - progress * topH;
      const body = card.querySelector(".lens-body");
      if (body) body.style.transform = "translateY(" + (-offset) + "px)";
    });
  }

  function bindDecks(root) {
    root.querySelectorAll("[data-deck]").forEach((deck) => {
      if (deck.dataset.bound === "1") return;
      deck.dataset.bound = "1";
      deck.addEventListener("scroll", () => layoutDeck(deck), { passive: true });
      deck.addEventListener("keydown", (event) => {
        const card = deck.querySelector(".lens-card");
        if (!card) return;
        const step = card.getBoundingClientRect().width + 20;
        if (event.key !== "ArrowRight" && event.key !== "ArrowLeft") return;
        event.preventDefault();
        deck.scrollBy({ left: event.key === "ArrowRight" ? step : -step, behavior: "smooth" });
      });
      layoutDeck(deck);
    });
  }

  function paint(program) {
    titleEl.textContent = program.title || "Тренировки";
    subEl.textContent = program.subtitle || "";
    document.title = program.title || "Тренировки";
    chapters.innerHTML = renderChapters(program);
    bindImages(chapters);
    bindDecks(chapters);
  }

  bindImages(chapters);
  bindDecks(chapters);

  chapters.addEventListener("toggle", (event) => {
    const details = event.target;
    if (!details.open) return;
    details.querySelectorAll("[data-deck]").forEach((deck) => {
      requestAnimationFrame(() => layoutDeck(deck));
    });
  });

  window.addEventListener("resize", () => {
    chapters.querySelectorAll("[data-deck]").forEach(layoutDeck);
  });

  try {
    const saved = localStorage.getItem(KEY);
    if (saved) {
      const data = JSON.parse(saved);
      if (validProgram(data)) {
        paint(data);
        resetBtn.hidden = false;
      }
    }
  } catch (err) {
    /* Quick Look and private mode have no storage. The printed book stays. */
  }

  fileInput.addEventListener("change", async () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file) return;
    try {
      const data = JSON.parse((await file.text()).replace(/^\uFEFF/, ""));
      if (!validProgram(data)) throw new Error("shape");
      localStorage.setItem(KEY, JSON.stringify(data));
      paint(data);
      resetBtn.hidden = false;
      status.textContent = "Загружено: " + file.name;
    } catch (err) {
      status.textContent = "Файл не подошёл. Нужен JSON с массивом workouts.";
    }
    fileInput.value = "";
  });

  resetBtn.addEventListener("click", () => {
    try { localStorage.removeItem(KEY); } catch (err) { /* ignore */ }
    location.hash = "";
    location.reload();
  });

  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  }
})();

</script>
